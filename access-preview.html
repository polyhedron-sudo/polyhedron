<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Polyhedron — Access Screen Preview</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#eee9de;font-family:system-ui,sans-serif}.stage{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 43%,#231913 0%,#111116 47%,#08090d 100%)}
.inner{width:min(100%,440px)}.image{position:relative;height:240px;display:grid;place-items:center;isolation:isolate}.image:before{content:"";position:absolute;z-index:-1;width:184px;height:184px;border-radius:50%;background:radial-gradient(circle,rgba(224,108,40,.27),rgba(176,75,27,.07) 54%,transparent 72%);filter:blur(12px);animation:aura 3.5s ease-in-out infinite}
.ring{position:absolute;width:215px;height:215px;border:1px solid rgba(218,150,85,.20);border-top-color:rgba(255,192,113,.8);border-bottom-color:rgba(255,192,113,.45);border-radius:50%;animation:orbit 9s linear infinite}.ring.second{width:232px;height:232px;border-color:rgba(218,150,85,.09);border-left-color:rgba(255,192,113,.48);border-right-color:rgba(255,192,113,.30);animation-duration:15s;animation-direction:reverse}.image img{width:194px;height:194px;object-fit:contain;filter:drop-shadow(0 0 12px rgba(221,108,42,.25))}
.eyebrow{color:#cbaa79;font-size:12px;font-weight:700;letter-spacing:.38em;margin-bottom:10px}h1{font:500 clamp(23px,4vw,30px)/1.25 Georgia,serif;margin:0}.hint{color:#b6aca0;font-size:14px;line-height:1.6;margin:14px 0 16px}.login{display:flex;flex-direction:column;gap:10px;width:min(100%,300px);margin:auto}.login input{width:100%;padding:13px 14px;background:#111116;border:1px solid #705136;color:#f0dfbd;border-radius:9px;font-size:16px}.login button{padding:11px 15px;background:#39291e;border:1px solid #705136;border-radius:9px;color:#f0dfbd;font-weight:600;cursor:pointer}.notice{font-size:12px;color:#cbaa79;min-height:26px}.credit{margin-top:42px;font:16px Georgia,serif;letter-spacing:.12em;color:#e5d1ad}.subcredit{margin-top:7px;font-size:10px;letter-spacing:.22em;color:#988b79}.preview{position:absolute;top:12px;left:12px;color:#d4c4ad;font-size:11px;opacity:.8}
@keyframes orbit{to{transform:rotate(360deg)}}@keyframes aura{0%,100%{transform:scale(.92);opacity:.62}50%{transform:scale(1.13);opacity:1}}@media(prefers-reduced-motion:reduce){.ring,.image:before{animation:none}}
</style></head><body><div class="stage"><div class="preview">ACCESS SCREEN PREVIEW — NO AUTHENTICATION ACTIVE</div><main class="inner"><div class="image" aria-hidden="true"><div class="ring"></div><div class="ring second"></div><img src="assets/polyhedron-icon.png" alt=""></div><div class="eyebrow">POLYHEDRON</div><h1>Waking the Game Master…</h1><p class="hint">Enter your password to begin your story.</p><form class="login" id="previewForm"><input id="password" type="password" autocomplete="off" placeholder="Password" aria-label="Password"><button type="submit">Enter Polyhedron</button><div class="notice" id="message" role="status"></div></form><div class="credit">BA F <span style="color:#84715b">+</span> GPT-6</div><div class="subcredit">A CREATIVE COLLABORATION</div></main></div><script>
document.getElementById('previewForm').addEventListener('submit',event=>{event.preventDefault();document.getElementById('password').value='';document.getElementById('message').textContent='Preview only — server-side password verification is not installed yet.';});
</script></body></html>
