<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Polyhedron — Model Selection</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div><div class="eyebrow">POLYHEDRON</div><h1 id="topbarTitle">Campaign</h1></div>
    <div class="status campaign-controls">
      <button id="changeModelBtn" class="ghost">Change Model</button>
      <button id="resetBtn" class="ghost">New Campaign</button>
      <button id="importBtn" class="ghost">Import</button>
      <button id="exportBtn" class="ghost">Export</button>
      <input id="importFile" type="file" accept="application/json,.json" hidden>
    </div>
  </header>
  <main id="app"></main>
</div>
<script src="expressions.js"></script>
<script src="rules.js"></script>
<script src="app.js"></script>
</body>
</html>
